<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 30">
  <!--
    The diagonals are counterchanged: red follows white on one side of each arm and
    leads it on the other. Drawn symmetrically — as this file was — the flag reads as
    a plus and an X laid on top of each other, which is the "slightly broken" look.
    The clip path is what puts the red on the correct half of each diagonal.
  -->
  <clipPath id="union-jack-counterchange">
    <path d="M25,15h25v15zv15h-25zh-25v-15zv-15h25z"/>
  </clipPath>
  <path d="M0,0v30h50v-30z" fill="#012169"/>
  <path d="M0,0 50,30M50,0 0,30" stroke="#fff" stroke-width="6"/>
  <path d="M0,0 50,30M50,0 0,30" clip-path="url(#union-jack-counterchange)" stroke="#C8102E" stroke-width="4"/>
  <path d="M-1 11h22v-12h8v12h22v8h-22v12h-8v-12h-22z" fill="#C8102E" stroke="#FFF" stroke-width="2"/>
</svg>
