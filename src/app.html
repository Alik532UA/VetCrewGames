<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<!--
			Без `maximum-scale=1, user-scalable=no`: заборона масштабування — це
			провал WCAG 1.4.4 (ACCESSIBILITY-v8 § 9, «текст масштабується до 200%
			без втрати функціональності»). Android Chrome цю заборону поважає, тож
			людина зі слабким зором не могла збільшити ні пояснення міфу, ні
			підписи тварин.

			Те, заради чого її ставлять, — випадковий зум від подвійного дотику по
			кнопці — знімається `touch-action: manipulation` у global.css, і саме
			там, де воно й потрібно: на кнопках і посиланнях, а не на всій
			сторінці.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="VetCrewGames" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<meta name="color-scheme" content="light dark" />
		<!--
			Правило приховування стоїть ТУТ, а не в загальному файлі стилів.
			Клас на першому кадрі без правила на першому кадрі не робить нічого, а
			на dev-сервері бандл приходить через JavaScript і запізнюється — системна
			смуга встигає блимнути й зникнути (SCROLLBAR-v8 § 8.3).

			Ховається смуга ПРОКРУТНИКА, а не документа: сторінка тут не
			прокручується, прокручується `.page-transition-wrapper` усередині.
		-->
		<style>
			html.has-custom-scrollbar .page-transition-wrapper {
				scrollbar-width: none;
			}

			html.has-custom-scrollbar .page-transition-wrapper::-webkit-scrollbar {
				display: none;
			}
		</style>
		%sveltekit.head%
		<!--
			Скрипт стоїть ПІСЛЯ %sveltekit.head% навмисно (SECURITY-v8 § 6.3).
			У static-профілі політика приходить мета-тегом, який SvelteKit
			вставляє саме на це місце, а мета-політика діє лише на те, що йде
			ПІСЛЯ неї. Доти скрипт стояв вище — тобто політикою не покривався
			зовсім, і його хеш був би декоративним.

			Затримка нульова: до цього місця в <head> лише мета-теги й
			посилання; жодного скрипта, який виконався б раніше, немає.

			Хеш цього тіла обчислює svelte.config.js із САМОГО ЦЬОГО ФАЙЛУ під
			час збірки. Правка нижче міняє хеш автоматично — вписаний рядком у
			конфіг він розійшовся б зі скриптом і зламав би сайт лише у
			збірці, не в dev.
		-->
		<script>
			// SYNC: ключ 'vetcrewgames_theme' — це PREFIX із src/lib/services/storage.ts,
			// а міграція 'light' → 'light-green' і вибір за prefers-color-scheme
			// продубльовані в конструкторі Settings (src/lib/services/settings.svelte.ts).
			// Скрипт першого кадру не може імпортувати нічого, тож логіка неминуче
			// існує у двох місцях; правляться вони РАЗОМ (UI-UX-v8 § 1.1).
			try {
				let theme = localStorage.getItem('vetcrewgames_theme');
				if (theme === 'light') theme = 'light-green';
				if (!theme) {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light-green';
				}
				document.documentElement.setAttribute('data-theme', theme);
				let meta = document.querySelector('meta[name="color-scheme"]');
				const isDark = theme === 'dark' || theme === 'orange-purple';
				if (meta) meta.setAttribute('content', isDark ? 'dark' : 'light dark');
			} catch (e) {}
			// SYNC: умови мусять збігатися з `controllers/scrollbar.svelte.ts` і
			// значенням за замовчуванням у `services/settings.svelte.ts`. Скрипт
			// першого кадру не може імпортувати їх, тож логіка неминуче існує у двох
			// місцях; розійдуться вони мовчки — як стрибок вигляду смуги після
			// гідрації (SCROLLBAR-v8 § 8.2). Звіряє їх `src/scrollbar.test.ts`.
			try {
				const mode = localStorage.getItem('vetcrewgames_scrollbarMode') || 'custom';
				const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
				if (fine && mode === 'custom') {
					document.documentElement.classList.add('has-custom-scrollbar');
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
