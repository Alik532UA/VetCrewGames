name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` — не смак, а умова того, що гейти взагалі
# виконуються (CI-CD-AND-TOOLS-v8 § 1.3, AI-AGENT-PITFALLS-v8 § 1.4). При
# `true` пуш пачкою комітів скасовує всі проміжні прогони, і прогін, який
# УПЕРШЕ виконав би щойно доданий гейт, не завершується ніколи: у переліку
# кроків він виглядає як «не дійшло», а читається як «там усе гаразд».
# Група `pages` заразом не дає двом деплоям писати на Pages одночасно.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Версія збігається з `engines.node` у package.json і з .nvmrc
      # (DEPENDENCIES-v8 § 2.3). Було 20 — а Node 20 вийшов з підтримки
      # 30.04.2026, тобто CI збирав продакшн на рантаймі без оновлень безпеки.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      # eslint був у проєкті, а гейта не було: `npm run lint` існував і в CI не
      # викликався (CODE-QUALITY-v8 § 6.5).
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # GATE-I18N-PARITY. Той самий клас дефекту, що рядком вище: скрипт лежав у
      # package.json і в AGENTS.md, а в CI його не кликав ніхто. Тепер це тримає
      # інваріант у `src/ci.test.ts` — «кожен гейт check* викликається в CI».
      #
      # Це НЕ копія `src/i18n-completeness.test.ts`, хоч обидва міряють паритет
      # ключів. Напрямки різні: інваріант іде від `LANGUAGES` до файлів і питає
      # «чи повна мова, яку ми ОБІЦЯЛИ віддавати»; цей скрипт іде від тек на
      # диску й питає «чи не розійшовся словник, який ще не ввімкнули». Саме так
      # тут і жили `de` з `nl` до 2026-08-16 — теками без рядка в `LANGUAGES`.
      - name: Check i18n parity
        if: ${{ !cancelled() }}
        run: npm run check:i18n

      # Кеш браузерів між прогонами: `npm ci` їх не приносить, а
      # `playwright install` без кешу качає ~130 МБ щоразу.
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # axe над ЗІБРАНИМ сайтом (ACCESSIBILITY-v8 § 10, GATE-A11Y-AXE). До
      # 2026-08-23 цього гейта в проєкті не було зовсім — не «зелений», а
      # відсутній. Конфіг Playwright сам робить `npm run build` і піднімає
      # прев'ю, тож окремого кроку збірки тут не потрібно.
      - name: E2E — axe над зібраним сайтом
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Поріг high, а не moderate: після оновлення лишилися лише 4 low, але
      # moderate-поріг довелося б вимкнути на першому ж транзитивному
      # попередженні, а вимкнений гейт гірший за відсутній.
      #
      # `--omit=dev` — вимога DEPENDENCIES-v8 (GATE-AUDIT), і вона про те, ЧИЯ
      # це вразливість. Інструменти збірки (vite, playwright, eslint) до
      # відвідувача не їдуть узагалі: їхній код не потрапляє ні в бандл, ні на
      # сервер. Без цього прапорця реліз блокує вразливість у тому, що ніколи
      # не виконається на чужій машині, — і саме так гейт доводиться вимикати.
      #
      # Ціна названа: вразливість у самому інструменті (наприклад, у тому, що
      # читає файли проєкту в CI) цей прогін більше не покаже. Її ловить
      # Dependabot, який відкриває PR щотижня незалежно від рівня.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Частина дефектів не існує в джерелах — вона виникає під час збірки, і
      # видно її лише у build/*.html (CODE-QUALITY-v8 § 7, SEO-v8 § 6.1).
      # Скрипт читає згенеровані сторінки: порожнє тіло, canonical на чужий
      # origin, `unsafe-inline` у script-src, інлайн-скрипт, не покритий
      # хешем, .map поруч із бандлом, бюджет initial JS.
      - name: Check build output
        run: npm run check:build

      # Ловить артефакт, що бруднить дерево: згенерований app-version.json,
      # оновлений lockfile (CI-CD-AND-TOOLS-v8 § 1.5). Це єдина машинна
      # перевірка правила «артефакт збірки не комітиться».
      - name: Build does not modify tracked files
        run: git diff --exit-code

      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

  # Правила доступу до бази — ЄДИНА межа безпеки спільної гри, і єдина частина
  # проєкту, стан якої не видно ні в `src/`, ні у `build/`: вони виконуються на
  # боці Firebase (CLOUD-DATABASE-v8 § 3.4). Тому окремий джоб із емулятором:
  # решта гейтів проходить однаково і на правильних правилах, і на «дозволити
  # все».
  #
  # Окремий джоб, а не крок у `build_site`, із двох причин: емулятор вимагає Java
  # (тобто ще один setup у критичному шляху деплою) і йому не потрібна збірка.
  # Так деплой не чекає на емулятор, а правила все одно перевіряються на кожному
  # пуші.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # Емулятор Realtime Database — java-процес. Без цього кроку `emulators:exec`
      # падає з «java not found», і це виглядає як зламані правила.
      - name: Install Java for the database emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Половина випадків «дозволено», половина «заборонено»: правила «дозволити
      # все» валять другу половину, «заборонити все» — першу. Скрипт сам падає,
      # якщо один із наборів спорожнів, тобто перевірка не може виродитися в
      # нічого.
      #
      # `firebase-tools` тут НЕ з devDependencies, а приїжджає через npx — див.
      # причину в scripts/firebase-cli.mjs: його транзитивна залежність
      # `superstatic` не приймає сучасний Node, а в проєкті стоїть
      # `engine-strict=true`, тож devDependency ламала б `npm install` цілком.
      # ШТАМП ВЕРСІЇ звіряється ПЕРЕД емулятором, бо він не потребує нічого:
      # два файли й хеш. Порядок не косметика — якщо штамп відстав, решта прогону
      # вже не важлива: правила, які виїдуть у продакшн, будуть іншими за ті, що
      # перевірив емулятор.
      - name: Rules stamp matches rules content
        run: npm run rules:stamp:check

      - name: Check database rules
        run: npm run check:rules

  # ВИКЛАДАННЯ ПРАВИЛ, і воно тут окремим джобом із трьох причин.
  #
  # ПЕРША: доти правила викладалися РУКАМИ — копіюванням файлу в консоль
  # Firebase. Наслідок був заміряний, а не гіпотетичний: 2026-08-23 зонд проти
  # живої бази показав, що в продакшні діє інша редакція, ніж у git, і через це
  # не працював список публічних кімнат. Тобто гейт на емуляторі був зелений, а
  # база жила за іншими правилами.
  #
  # ДРУГА: `needs: rules` обов'язковий. Викласти правила, які не пройшли
  # емулятор, гірше, ніж не викласти нічого: у продакшн поїхала б редакція, яку
  # ніхто не перевіряв.
  #
  # ТРЕТЯ: `if` на `main`. Правила — спільний ресурс проєкту Firebase, і гілка,
  # яку ще обговорюють, не має права їх переписати.
  #
  # ПІСЛЯ викладання — ЗОНД. Без нього «деплой зелений» означало б лише «команда
  # не впала»: `firebase deploy` рапортує успіх і тоді, коли виклав не те, що
  # думав автор (не той проєкт, не та гілка конфігу). Зонд входить анонімно
  # публічним ключем і читає `/__rulesVersion/<штамп>` — тобто перевіряє тим самим
  # шляхом, яким ходить відвідувач. Сервісний акаунт для цього не годиться: його
  # токен обходить правила цілком, і зонд завжди казав би «викладено».
  rules_deploy:
    needs: rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Токен GITHUB_TOKEN цій роботі не потрібен ні для чого: вона нічого не пише
    # в репозиторій. Порожній перелік прав — найдешевше звуження, яке взагалі є.
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Зрозуміла відмова замість незрозумілої: без секрету `firebase deploy`
      # падає з «not logged in», і причина виглядає як поломка інструмента.
      - name: Service account is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Немає секрету FIREBASE_SERVICE_ACCOUNT. Firebase Console → Project settings → Service accounts → Generate new private key, і вміст JSON цілком у Settings → Secrets and variables → Actions."
            exit 1
          fi

      # СЕКРЕТ ПРИХОДИТЬ ЧЕРЕЗ `env`, А НЕ ЧЕРЕЗ `${{ }}` У ТІЛІ СКРИПТА.
      #
      # Різниця не косметична, і це прямо описане в посібнику GitHub із
      # безпеки: вираз `${{ ... }}` підставляється в текст команди ДО запуску
      # оболонки. Тобто значення секрету стає частиною командного рядка, і
      # будь-який символ у ньому тлумачиться оболонкою — від зламаних лапок до
      # виконання чужої команди. Через `env` значення передається окремо й для
      # оболонки лишається просто рядком.
      #
      # `printf '%s' "$VAR"` у лапках — з тієї самої причини: без лапок оболонка
      # розбила б JSON по пробілах.
      #
      # `trap` замість `rm` останнім рядком: у Actions кроки виконуються з
      # `bash -e`, тож при впалому деплої останній рядок НЕ виконався б і файл із
      # ключем лишився б на диску. Раннер одноразовий, але покладатися на це —
      # значить покладатися на чужу обіцянку.
      #
      # ЩО БУЛО Б НАДІЙНІШЕ: Workload Identity Federation
      # (`google-github-actions/auth`) — тоді довготривалого ключа не існує
      # взагалі, а `firebase-tools` так само читає `GOOGLE_APPLICATION_CREDENTIALS`.
      # Не зроблено тут, бо це вимагає налаштування пулу на боці Google Cloud, а
      # не в репозиторії; варіант із ключем працює без жодних змін у GCP.
      - name: Deploy database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm run rules:deploy

      # Перевірка ПІСЛЯ викладання: чи справді в базі тепер та редакція.
      - name: Verify deployed rules
        run: npm run check:rules:live

  # САЙТ ВИЇЖДЖАЄ ПІСЛЯ ПРАВИЛ, а не паралельно з ними.
  #
  # Доти `deploy` залежав лише від `build_site`, тобто дві роботи йшли поруч — і
  # порядок вирішувала випадковість. Це не теоретичний ризик: рівно в цьому
  # комміті клієнт почав читати перелік кімнат ЗАПИТОМ (`orderByChild('at')` плюс
  # `limitToLast`), а працює такий запит лише з новим правилом і `.indexOn`. Якби
  # Pages виїхав першим, живий сайт кілька хвилин ходив би до бази запитом, якого
  # її правила ще не знають, — і виглядало б це як зламані кімнати, а не як
  # порядок робіт.
  #
  # Правило простіше за виняток: новий клієнт може вимагати нових правил, старий
  # клієнт нових правил не ламає. Отже правила — завжди перші.
  #
  # `workflow` спрацьовує лише на `main` (див. `on:` вище), тож `rules_deploy` тут
  # не буває пропущеним — а пропущена залежність пропустила б і цю роботу.
  deploy:
    needs: [build_site, rules_deploy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
